# ============================================================
# 相机内参标定结果 (OpenCV pinhole 模型)
# 生成工具: calibrate_camera.py
# 标定板: 9x6 内角点, 方格边长 24.0 mm
# 有效图片: 28 张
# ============================================================

# -------------------- 图像尺寸 --------------------
image_width: 1920      # 图像宽度 (像素)
image_height: 1080     # 图像高度 (像素)

# -------------------- 相机内参矩阵 K --------------------
# 3x3 矩阵，描述相机坐标系 -> 像素坐标系的映射
#  [ fx   0   cx ]
#  [ 0   fy   cy ]
#  [ 0    0    1 ]
#
# fx, fy: 焦距 (像素单位)。值越大，镜头越长焦。
# cx, cy: 主点/光心 (像素单位)。理想情况下应在图像中心 (960, 540)。
camera_matrix:
  rows: 3
  cols: 3
  data:
    - 1623.7143952411014   # fx: x 方向焦距
    - 0.0                  # (0,1) 元素，单目相机始终为 0
    - 915.0067865669471    # cx: 主点 x 坐标
    - 0.0                  # (1,0) 元素，单目相机始终为 0
    - 1622.908591349681    # fy: y 方向焦距
    - 597.0910956177317    # cy: 主点 y 坐标
    - 0.0
    - 0.0
    - 1.0                  # (2,2) 元素，齐次坐标归一化

# -------------------- 畸变系数 D --------------------
# 5 个参数: [k1, k2, p1, p2, k3]
# 径向畸变 (k1, k2, k3): 由镜头形状引起，远离中心畸变越大
#   k1>0: 桶形畸变  |  k1<0: 枕形畸变
# 切向畸变 (p1, p2): 由镜头与成像平面不平行引起
# 去畸变 OpenCV 函数: cv2.undistort(image, K, D)
distortion_coefficients:
  rows: 1
  cols: 5
  data:
    - 0.05698277586417921    # k1: 一阶径向畸变
    - -0.05057912376957244   # k2: 二阶径向畸变
    - 0.005014261987827101   # p1: 一阶切向畸变
    - -0.006800908423951358  # p2: 二阶切向畸变
    - -0.33223759763148465   # k3: 三阶径向畸变

# -------------------- 标定质量 --------------------
reprojection_error: 0.7385861208680751
# 重投影误差 (RMSE, 像素)。<0.5 优秀, <1.0 可接受。
# 含义: 用标定参数把 3D 角点投影回 2D，与检测到的角点的平均偏差。

# -------------------- 标定配置信息 --------------------
checkerboard:
  inner_corners: [9, 6]       # 棋盘格内角点数量 (横向, 纵向)
  square_size_mm: 24.0        # 每个方格的边长 (毫米)
